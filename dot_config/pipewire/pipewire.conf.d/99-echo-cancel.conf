# Echo cancellation: removes desktop audio (YouTube, games, music) from the mic.
# Uses WebRTC AEC with the monitor of the current default output as the echo
# reference, so ALL audio played through the speakers is cancelled - no virtual
# sink needed, and it follows the default output when you switch devices.
# Select "Echo-Cancelled Microphone" as the input device in Discord.

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc

            # Capture the echo reference from the monitor of the real output
            # instead of creating a virtual speaker.
            monitor.mode = true

            capture.props = {
                # Real microphone (Razer Seiren Mini). Unlike playback.props
                # below, this MUST be pinned: echo-cancel-source is itself the
                # default input, so "follow the default" is circular. Without a
                # target, WirePlumber skips our own link-group and falls through
                # to the highest-priority remaining source - which is the
                # onboard pro-input-0 (2500), not this mic (2100).
                # Change this line if you swap microphones.
                node.target = "alsa_input.usb-Razer_Inc_Razer_Seiren_Mini_UC2136L03306453-00.mono-fallback"
                node.passive = true
            }

            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Echo-Cancelled Microphone"
            }

            playback.props = {
                # Echo reference: no node.target, so the session manager binds
                # this to whatever the default output is and follows it when
                # the default changes (speakers -> headphones -> HDMI, etc).
                node.passive = true
            }
        }
    }
]
