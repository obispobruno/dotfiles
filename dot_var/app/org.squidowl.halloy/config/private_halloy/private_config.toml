# Halloy config.
#
# For a complete list of available options,
# please visit https://halloy.chat/configuration.html

# Type: float
# Values: 0.1 .. 3.0
# Default: 1.0
scale_factor = 1.5

[servers.irchighway]
nickname = "halloy6203"
server = "irc.irchighway.net"
channels = ["#ebooks"]
# IRCHighway uses a self-signed cert (marked CA:TRUE), which rustls rejects
dangerously_accept_invalid_certs = true
